name: CI/CD Pipeline - Quintal dos Pets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validação da Estrutura do Projeto
        run: |
          echo "Verificando arquivos principais..."
          test -f index.html || { echo "index.html não encontrado"; exit 1; }
          echo "Arquivos validados com sucesso!"

      - name: Deploy Automatizado
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: echo "Implantação concluída com sucesso no ambiente de produção!"
